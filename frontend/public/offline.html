<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>You’re offline · LearnMap</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #f5f5f7; color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } .card { background: #1c1c1e !important; } p { color: #a1a1a6 !important; } }
    .card { background: #fff; border-radius: 20px; padding: 32px 28px; max-width: 380px; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #6e6e73; line-height: 1.5; margin: 0 0 20px; }
    button { font: inherit; font-weight: 600; background: #0071e3; color: #fff; border: 0; border-radius: 980px; padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo192.png" alt="" />
    <h1>You’re offline</h1>
    <p>LearnMap needs an internet connection for your roadmaps and AI help. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
